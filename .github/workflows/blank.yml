name: Build iOS (IPA sem assinatura)
on:
  workflow_dispatch: {}
  push:
    tags: ['ios-v*']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project CentroDeComando.xcodeproj -scheme CentroDeComando \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CentroDeComando.app Payload/
          zip -r CentroDeComando.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CentroDeComando-ios-unsigned
          path: CentroDeComando.ipa
